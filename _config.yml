# IELTS Study Notes - Jekyll Configuration
theme: minima
title: IELTS 學習筆記 | 準備指南
description: 完整的 IELTS 考試準備筆記、策略和資源集合
tagline: Comprehensive IELTS Preparation Resources

# Site settings
url: "https://ielts-prepare.dennisleehappy.org"
baseurl: ""
lang: zh-TW
author: IELTS Learner
timezone: Asia/Taipei
email: your-email@example.com

# Build settings
markdown: kramdown
highlighter: rouge
show_excerpts: true
permalink: /:categories/:path/
relative_links:
  enabled: true
  collections: true

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false

# Rouge syntax highlighting
rouge:
  theme: github

# Navigation Menu
header_pages:
  - 01_Listening/index.md
  - 02_Reading/index.md
  - 03_Writing/index.md
  - 04_Speaking/index.md

# Social Links
twitter_username:
github_username: dennisleehappy
linkedin_username:

# Collections
collections:
  listening:
    output: true
    permalink: /listening/:path/
  reading:
    output: true
    permalink: /reading/:path/
  writing:
    output: true
    permalink: /writing/:path/
  speaking:
    output: true
    permalink: /speaking/:path/
  posts:
    output: true
    permalink: /:collection/:name/

# Custom permalink structure for practice logs
permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
      author: "IELTS Learner"
      show_excerpts: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

# Paginate
paginate: 10
paginate_path: "/blog/page:num/"

# SEO and Social
seo:
  type: "WebSite"
  name: "IELTS Study Notes"
  description: "Complete IELTS preparation resources and study guides"
  url: "https://ielts-prepare.dennisleehappy.org"
  image: "/assets/images/ielts-logo.png"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - gh-conflict.sh
  - cli.txt
  - .github/
  - .gitignore
  - .DS_Store
  - Thumbs.db

# Include files that should be processed
include:
  - _pages
  - _data
